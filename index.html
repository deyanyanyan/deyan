<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deyan — Portfolio</title>
  <meta name="description" content="Aspiring Product Manager. CS undergrad. Film & media. Gamer." />

  <!-- Design tokens + base styles -->
  <link rel="stylesheet" href="colors_and_type.css" />
  <!-- Component styles -->
  <link rel="stylesheet" href="kit.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Lucide icons (CDN, MIT-licensed) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- React 18 + ReactDOM (CDN) -->

  <!-- Components (each exports to window.*) -->

  <script type="text/babel" src="About.jsx"></script>

  <!-- Root app (mounts everything) -->

</html>
